<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Facility-CARS | Interactive Prototype</title>
<style>
:root{--navy:#142b45;--blue:#2f6f9f;--sky:#eaf2f8;--ink:#1d2b3a;--muted:#718096;--line:#e4eaf0;--bg:#f4f7fa;--green:#21845b;--amber:#b7791f;--red:#b84c4c;--white:#fff;--shadow:0 8px 28px rgba(22,43,66,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#eaf2f8;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;gap:12px;align-items:center;padding:2px 8px 18px;border-bottom:1px solid #ffffff20}.brandmark{width:40px;height:40px;border-radius:12px;background:#d7e8f4;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:18px}.brand strong{display:block;font-size:14px;letter-spacing:.2px}.brand small{color:#afc4d6}.navlabel{font-size:10px;letter-spacing:1.3px;color:#8da8be;padding:0 10px;margin:4px 0}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c5d5e2;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff17;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.sidebottom{margin-top:auto;border-top:1px solid #ffffff20;padding:16px 8px 0;color:#a9bfd0;font-size:12px}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.crumb{font-weight:700;font-size:15px}.topright{display:flex;align-items:center;gap:12px}.role{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;color:var(--ink)}.avatar{width:34px;height:34px;border-radius:50%;background:#dceaf4;color:var(--navy);display:grid;place-items:center;font-weight:800}.content{padding:30px 34px;max-width:1450px;margin:auto}.pagehead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.h1{font-size:26px;letter-spacing:-.6px;margin:4px 0 5px;color:#172c42}.sub{color:var(--muted);margin:0}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;background:var(--navy);color:white;box-shadow:0 3px 8px #142b4520}.btn:hover{filter:brightness(1.12)}.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}.btn.blue{background:var(--blue)}.btn.green{background:var(--green)}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.stat{display:flex;justify-content:space-between;align-items:flex-start}.stat .label{color:var(--muted);font-size:12px;font-weight:600}.stat .num{font-size:27px;font-weight:800;margin-top:7px;color:#172c42}.stat .badgeicon{width:38px;height:38px;border-radius:11px;background:var(--sky);display:grid;place-items:center;font-size:18px}.delta{font-size:11px;color:var(--green);margin-top:4px}.cols{grid-template-columns:1.45fr 1fr}.sectiontitle{font-size:15px;font-weight:800;margin:0 0 14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:580px}th{text-align:left;color:#738397;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:10px 9px;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid #edf1f5;font-size:13px}tr:last-child td{border-bottom:0}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:800;background:#edf2f7;color:#536477}.pill.green{background:#e6f5ed;color:#1d754e}.pill.amber{background:#fff4df;color:#996315}.pill.red{background:#fdecec;color:#a33f3f}.pill.blue{background:#e8f2fb;color:#2c6795}.activity{display:grid;gap:14px}.activityrow{display:flex;gap:12px;align-items:flex-start}.dot{width:9px;height:9px;border-radius:50%;background:#5e93ba;margin-top:5px;box-shadow:0 0 0 4px #eaf2f8}.activityrow strong{display:block;font-size:12px}.activityrow small{color:var(--muted)}.facilitygrid{grid-template-columns:repeat(3,minmax(0,1fr))}.facility{padding:0;overflow:hidden}.facilitytop{height:104px;background:linear-gradient(135deg,#dceaf4,#f2f6fa);display:flex;align-items:center;justify-content:center;font-size:36px}.facilitybody{padding:16px}.facilitybody h3{margin:0 0 4px;font-size:15px}.facilitybody p{margin:0 0 12px;color:var(--muted);font-size:12px}.meta{display:flex;justify-content:space-between;color:#647589;font-size:11px;margin-bottom:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#526477}.field input,.field select,.field textarea{width:100%;border:1px solid #dce4ec;border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink)}.field textarea{min-height:75px;resize:vertical}.hint{font-size:11px;color:var(--muted)}.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.step{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:11px;color:#718096}.step.active{background:#eaf2f8;border-color:#b9d0e1;color:#245b83;font-weight:800}.notice{padding:13px 15px;border-radius:10px;background:#eef5fa;border:1px solid #d6e5f0;color:#315b79;font-size:12px;margin:14px 0}.notice.warn{background:#fff7e8;border-color:#f2dfb7;color:#805a18}.scorebar{height:8px;background:#edf1f5;border-radius:99px;overflow:hidden}.scorebar span{height:100%;display:block;background:var(--blue);border-radius:99px}.scoreline{display:grid;grid-template-columns:140px 1fr 45px;gap:10px;align-items:center;font-size:12px;margin:12px 0}.kpi{font-size:28px;font-weight:850;color:var(--navy)}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.qrbox{width:180px;height:180px;border:10px solid #fff;outline:1px solid var(--line);border-radius:8px;margin:8px auto 14px;background:repeating-conic-gradient(#172c42 0% 25%,#fff 0% 50%) 50% / 18px 18px;position:relative}.qrbox:after{content:"CARS";position:absolute;inset:65px 48px;background:#fff;display:grid;place-items:center;font-weight:900;color:var(--navy);font-size:14px}.center{text-align:center}.empty{padding:35px;text-align:center;color:var(--muted)}.hidden{display:none!important}.footnote{color:#8996a5;font-size:11px;margin-top:20px}.tagrow{display:flex;gap:7px;flex-wrap:wrap}.mini{font-size:11px;color:var(--muted)}.barrow{display:grid;grid-template-columns:105px 1fr 42px;gap:10px;align-items:center;margin:10px 0;font-size:12px}.bar{height:9px;background:#edf1f5;border-radius:10px;overflow:hidden}.bar i{height:100%;display:block;background:#4e88b3;border-radius:10px}.callout{border-left:3px solid #4e88b3;padding:10px 13px;background:#f5f9fc;border-radius:0 8px 8px 0;font-size:12px;color:#526477}
@media(max-width:1050px){.app{grid-template-columns:210px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.facilitygrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px}.brand{padding:5px;border:0}.navlabel,.sidebottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px 10px}.topbar{height:60px;padding:0 16px}.content{padding:20px 15px}.pagehead{display:block}.pagehead .btn{margin-top:12px}.stats{grid-template-columns:repeat(2,1fr)}.facilitygrid{grid-template-columns:1fr}.formgrid,.split{grid-template-columns:1fr}.topright .role{max-width:130px}}
</style></head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brandmark">C</div><div><strong>SMART FACILITY-CARS</strong><small>Campus Resource System</small></div></div>
 <div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav">
  <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
  <button data-page="facilities"><span class="ico">▤</span>Fasilitas</button>
  <button data-page="booking"><span class="ico">＋</span>Ajukan Reservasi</button>
  <button data-page="reservations"><span class="ico">▣</span>Reservasi</button>
  <button data-page="verification"><span class="ico">✓</span>Verifikasi</button>
  <button data-page="allocation"><span class="ico">⇄</span>Mesin Alokasi</button>
  <button data-page="fairness"><span class="ico">◉</span>Fairness Radar</button>
  <button data-page="qr"><span class="ico">▦</span>QR Check-in/out</button>
  <button data-page="audit"><span class="ico">≡</span>Log & Audit</button>
 </nav></div>
 <div class="sidebottom">Prototype interaktif · Data simulasi<br>Smart Facility-CARS V2</div>
</aside>
<main class="main">
 <header class="topbar"><div class="crumb" id="crumb">Dashboard</div><div class="topright"><select class="role" id="role"><option>Mahasiswa</option><option>Dosen</option><option>Sarpras</option><option>Admin</option></select><div class="avatar" id="avatar">M</div></div></header>
 <div class="content" id="content"></div>
</main></div>
<script>
const $=s=>document.querySelector(s);const content=$('#content');let page='dashboard';let role='Mahasiswa';
let reservations=[
{id:'RSV-0261',group:'Kelas B',facility:'Laboratorium Kimia',date:'18 Nov 2026',time:'09.00–11.00',activity:'Observasi UTS',status:'APPROVED',score:85.20,requester:'Andi Pratama',U:80.75,W:90,R:95},
{id:'RSV-0262',group:'Kelas A',facility:'Laboratorium Kimia',date:'18 Nov 2026',time:'09.00–11.00',activity:'Praktikum wajib',status:'WAITLISTED',score:76.75,requester:'Siti Rahma',U:91.25,W:70,R:30},
{id:'RSV-0263',group:'Kelas C',facility:'Laboratorium Kimia',date:'18 Nov 2026',time:'09.00–11.00',activity:'Penelitian UAS',status:'REJECTED',score:92.90,requester:'Budi Santoso',U:96.5,W:80,R:100},
{id:'RSV-0264',group:'Kelas D',facility:'Ruang Diskusi 2',date:'19 Nov 2026',time:'13.00–15.00',activity:'Presentasi UTS',status:'PENDING_VERIFICATION',score:85.05,requester:'Rina Putri',U:84.25,W:90,R:80}
];let selected='RSV-0261';let scanDone=false;let eventLog=['Reservasi RSV-0261 disetujui oleh Sarpras','Verifikasi kegiatan Kelas B selesai','Token QR demo diterbitkan untuk RSV-0261'];
const statusPill=s=>{let c=s==='APPROVED'||s==='CHECKED_IN'||s==='COMPLETED'?'green':s==='PENDING_VERIFICATION'||s==='OFFERED'?'amber':s==='REJECTED'||s==='NO_SHOW'?'red':'blue';return `<span class="pill ${c}">${s.replaceAll('_',' ')}</span>`};
function head(kicker,title,sub,btn=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><div class="h1">${title}</div><p class="sub">${sub}</p></div>${btn}</div>`}
function stat(label,num,icon,delta){return `<div class="card stat"><div><div class="label">${label}</div><div class="num">${num}</div><div class="delta">${delta}</div></div><div class="badgeicon">${icon}</div></div>`}
function tableRows(rows){return rows.map(r=>`<tr><td><strong>${r.id}</strong><div class="mini">${r.group} · ${r.requester}</div></td><td>${r.facility}<div class="mini">${r.date} · ${r.time}</div></td><td>${r.activity}</td><td>${statusPill(r.status)}</td><td><button class="btn secondary small" onclick="openReservation('${r.id}')">Detail</button></td></tr>`).join('')}
function dashboard(){return head('OVERVIEW','Dashboard','Ringkasan aktivitas reservasi fasilitas kampus.',`<button class="btn" onclick="go('booking')">＋ Buat Reservasi</button>`)+`<div class="grid stats">${stat('Total reservasi','128','▣','↑ 12% dari bulan lalu')}${stat('Menunggu verifikasi','08','◷','Perlu ditinjau dosen')}${stat('Fasilitas tersedia','14','▤','Dari 18 fasilitas')}${stat('Konflik jadwal','03','⇄','Menunggu alokasi')}</div><div class="grid cols"><section class="card"><h3 class="sectiontitle">Reservasi terbaru</h3><div class="tablewrap"><table><thead><tr><th>Pengajuan</th><th>Fasilitas & waktu</th><th>Kegiatan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${tableRows(reservations.slice(0,4))}</tbody></table></div></section><section class="card"><h3 class="sectiontitle">Aktivitas sistem</h3><div class="activity">${eventLog.map((e,i)=>`<div class="activityrow"><span class="dot"></span><div><strong>${e}</strong><small>${i===0?'Baru saja':i===1?'10 menit lalu':'Hari ini'}</small></div></div>`).join('')}</div><div class="notice">Mode demo: seluruh akun dan transaksi pada mockup ini menggunakan data simulasi.</div></section></div>`}
function facilities(){let fs=[['🧪','Laboratorium Kimia','Lab · Gedung C','30 orang','Sertifikasi lab wajib','Tersedia'],['💬','Ruang Diskusi 2','Diskusi · Gedung A','12 orang','Tanpa sertifikasi khusus','Tersedia'],['🎥','Studio Multimedia','Studio · Gedung B','20 orang','Operator/perangkat tertentu','Terjadwal'],['📚','Ruang Seminar 1','Seminar · Gedung D','80 orang','Persetujuan Sarpras','Tersedia'],['🔬','Laboratorium Biologi','Lab · Gedung C','24 orang','Sertifikasi lab wajib','Tersedia'],['🖥️','Lab Komputer 1','Komputer · Gedung E','35 orang','Akun laboratorium','Tersedia']];return head('INVENTARIS','Katalog Fasilitas','Pilih fasilitas untuk melihat kapasitas, persyaratan, dan ketersediaan.')+`<div class="grid facilitygrid">${fs.map((f,i)=>`<div class="card facility"><div class="facilitytop">${f[0]}</div><div class="facilitybody"><h3>${f[1]}</h3><p>${f[2]}</p><div class="meta"><span>♙ ${f[3]}</span><span>${f[5]==='Tersedia'?'<span class="pill green">Tersedia</span>':'<span class="pill amber">Terjadwal</span>'}</span></div><div class="mini">Persyaratan: ${f[4]}</div><button class="btn secondary small" style="margin-top:13px" onclick="prefill('${f[1]}')">Ajukan fasilitas</button></div></div>`).join('')}</div>`}
function booking(){return head('RESERVATION REQUEST','Ajukan Reservasi','Lengkapi formulir. Pertanyaan dan persyaratan mengikuti fasilitas serta jenis kegiatan.')+`<div class="steps"><span class="step active">1 · Data pengajuan</span><span class="step">2 · Pemeriksaan syarat</span><span class="step">3 · Konfirmasi</span></div><div class="card"><div class="formgrid"><div class="field"><label>Nama pemohon / penanggung jawab</label><input id="reqname" value="Andi Pratama"></div><div class="field"><label>Kelas / kelompok</label><input id="group" value="Kelas F"></div><div class="field"><label>Fasilitas</label><select id="facility"><option>Laboratorium Kimia</option><option>Ruang Diskusi 2</option><option>Studio Multimedia</option><option>Ruang Seminar 1</option><option>Laboratorium Biologi</option><option>Lab Komputer 1</option></select></div><div class="field"><label>Jenis kegiatan</label><select id="activity"><option>Praktikum wajib</option><option>Observasi UTS</option><option>Presentasi UTS</option><option>Diskusi kelompok</option><option>Penelitian</option></select></div><div class="field"><label>Tanggal penggunaan</label><input id="date" type="date" value="2026-11-18"></div><div class="field"><label>Slot waktu</label><select id="time"><option>09.00–11.00</option><option>11.00–13.00</option><option>13.00–15.00</option><option>15.00–17.00</option></select></div><div class="field"><label>Jumlah peserta</label><input id="people" type="number" value="25"></div><div class="field"><label>Apakah kegiatan wajib?</label><select id="mandatory"><option value="yes">Ya, wajib akademik</option><option value="no">Tidak / fleksibel</option></select></div><div class="field full"><label>Alasan dan kebutuhan peralatan</label><textarea id="reason">Praktikum terjadwal membutuhkan meja laboratorium dan perangkat praktikum kimia.</textarea></div><div class="field"><label>Sertifikasi penanggung jawab</label><select id="cert"><option value="valid">Valid</option><option value="expired">Kedaluwarsa / tidak tersedia</option><option value="na">Tidak dipersyaratkan</option></select></div><div class="field"><label>Alternatif jadwal/fasilitas</label><select id="flex"><option value="yes">Bersedia menerima alternatif setara</option><option value="no">Tidak dapat dipindahkan</option></select></div></div><div class="notice">Form adaptif demo: sistem akan memeriksa kapasitas, sertifikasi, dan kebutuhan kegiatan sebelum pengajuan diteruskan.</div><button class="btn" onclick="submitBooking()">Kirim & periksa kelayakan</button><div id="bookingResult"></div></div>`}
function reservationsPage(){return head('TRANSACTION','Daftar Reservasi','Pantau status, jadwal, hasil evaluasi, dan tawaran alternatif.')+`<div class="card"><div class="tablewrap"><table><thead><tr><th>ID / Pemohon</th><th>Fasilitas & waktu</th><th>Kegiatan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${tableRows(reservations)}</tbody></table></div></div>`}
function verification(){return head('ACADEMIC CHECK','Verifikasi Pengajuan','Dosen atau petugas berwenang memeriksa bukti kegiatan dan persyaratan.')+`<div class="grid cols"><div class="card"><h3 class="sectiontitle">Antrean verifikasi</h3>${reservations.filter(r=>r.status==='PENDING_VERIFICATION').map(r=>`<div class="activityrow" style="margin:15px 0"><span class="dot"></span><div style="flex:1"><strong>${r.id} · ${r.group}</strong><small>${r.activity} · ${r.facility}</small><div style="margin-top:9px"><button class="btn green small" onclick="verify('${r.id}',true)">Setujui bukti</button> <button class="btn secondary small" onclick="verify('${r.id}',false)">Minta perbaikan</button></div></div></div>`).join('')||'<div class="empty">Tidak ada pengajuan menunggu verifikasi.</div>'}</div><div class="card"><h3 class="sectiontitle">Checklist pemeriksaan</h3><div class="activity"><div>✓ Identitas pemohon dan kelompok</div><div>✓ Kegiatan dan tujuan penggunaan</div><div>✓ Bukti kegiatan wajib / tenggat</div><div>✓ Sertifikasi dan izin fasilitas</div><div>✓ Kesesuaian kapasitas dan alat</div></div><div class="notice warn">Skor prioritas tidak dapat menggantikan persyaratan keselamatan atau izin fasilitas.</div></div></div>`}
function allocation(){return head('DECISION ENGINE','Mesin Alokasi','Contoh konflik pada Laboratorium Kimia, slot 18 November 2026 · 09.00–11.00.')+`<div class="card"><div class="tagrow"><span class="pill blue">3 pengajuan pada slot sama</span><span class="pill green">2 eligible</span><span class="pill red">1 tidak eligible</span></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Kelas</th><th>Kegiatan</th><th>U (60%)</th><th>W (25%)</th><th>R (15%)</th><th>Skor</th><th>Eligibility</th></tr></thead><tbody><tr><td><strong>Kelas A</strong></td><td>Praktikum wajib</td><td>91,25</td><td>70</td><td>30</td><td><strong>76,75</strong></td><td>${statusPill('APPROVED')}</td></tr><tr><td><strong>Kelas B</strong></td><td>Observasi UTS</td><td>80,75</td><td>90</td><td>95</td><td><strong>85,20</strong></td><td>${statusPill('APPROVED')}</td></tr><tr><td><strong>Kelas C</strong></td><td>Penelitian UAS</td><td>96,50</td><td>80</td><td>100</td><td><strong>92,90</strong></td><td>${statusPill('REJECTED')}</td></tr></tbody></table></div><div class="notice warn">Kelas C memiliki skor tertinggi, tetapi tidak eligible karena sertifikasi laboratorium wajib belum terpenuhi. Pengajuan tersebut tidak ikut pemeringkatan.</div><div class="split"><div><h3 class="sectiontitle">Peringkat kandidat eligible</h3><div class="barrow"><span>Kelas B</span><div class="bar"><i style="width:85.2%"></i></div><strong>85,20</strong></div><div class="barrow"><span>Kelas A</span><div class="bar"><i style="width:76.75%"></i></div><strong>76,75</strong></div></div><div><h3 class="sectiontitle">Smart Alternative Matching</h3><p class="sub">Kelas B dapat ditawari ruang alternatif yang setara untuk kegiatan observasi.</p><div class="callout">Jika alternatif tersedia, memenuhi kebutuhan, dan diterima Kelas B sebelum persetujuan dikunci, slot laboratorium dapat diberikan kepada Kelas A.</div><button class="btn blue" style="margin-top:13px" onclick="offerAlt()">Simulasikan tawaran alternatif</button><div id="altResult"></div></div></div></div>`}
function fairness(){return head('DECISION EXPLAINABILITY','Fairness Radar','Lihat kontribusi skor dan simulasi perubahan bobot. Radar adalah alat evaluasi, bukan penentu pemenang otomatis.')+`<div class="grid cols"><div class="card"><h3 class="sectiontitle">Kontribusi skor Kelas B</h3>${[['Urgensi kontekstual',48.45],['Urgensi waktu',22.5],['Reputasi',14.25]].map(x=>`<div class="scoreline"><span>${x[0]}</span><div class="scorebar"><span style="width:${x[1]/85.2*100}%"></span></div><strong>${x[1].toFixed(2)}</strong></div>`).join('')}<div class="notice">Total skor = 48,45 + 22,50 + 14,25 = 85,20.</div></div><div class="card"><h3 class="sectiontitle">Uji sensitivitas reputasi</h3><p class="sub">Samakan reputasi Kelas A dan B menjadi 95.</p><div class="barrow"><span>Kelas A awal</span><div class="bar"><i style="width:76.75%"></i></div><strong>76,75</strong></div><div class="barrow"><span>Kelas A simulasi</span><div class="bar"><i style="width:86.5%"></i></div><strong>86,50</strong></div><div class="barrow"><span>Kelas B</span><div class="bar"><i style="width:85.2%"></i></div><strong>85,20</strong></div><div class="notice warn">Pemenang berubah pada skenario bobot/reputasi ini. Hasil simulasi tidak mengubah keputusan reservasi yang sudah dikunci.</div><button class="btn secondary" onclick="log('Uji sensitivitas Fairness Radar dijalankan')">Catat hasil evaluasi</button></div></div>`}
function qr(){let r=reservations.find(x=>x.id===selected)||reservations[0];return head('FACILITY ACCESS','QR Check-in / Check-out','Simulasi verifikasi penggunaan fasilitas oleh petugas resmi.')+`<div class="grid cols"><div class="card center"><h3 class="sectiontitle">Token reservasi</h3><div class="tagrow" style="justify-content:center"><span class="pill green">${r.status}</span><span class="pill blue">Demo token</span></div><div class="qrbox"></div><strong>${r.id}</strong><div class="mini">${r.group} · ${r.facility}</div><div class="mini">${r.date} · ${r.time}</div><div class="notice">Visual QR ini hanya ilustrasi. Token HMAC-SHA256 dan validasi backend belum diimplementasikan pada prototype.</div><label class="mini">Pilih reservasi</label><select id="qrselect" class="role" onchange="selected=this.value;render()">${reservations.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${x.id} · ${x.group}</option>`).join('')}</select></div><div class="card"><h3 class="sectiontitle">Panel petugas scanner</h3><div class="field"><label>ID perangkat</label><input value="SCN-GDG-C-01" readonly></div><div class="field" style="margin-top:12px"><label>Petugas</label><input value="Petugas Sarpras Demo" readonly></div><div class="field" style="margin-top:12px"><label>Hasil pemeriksaan</label><input id="scanstatus" value="Menunggu pemindaian" readonly></div><div class="split" style="margin-top:16px"><button class="btn green" onclick="scan('CHECK_IN')">Simulasi Check-in</button><button class="btn blue" onclick="scan('CHECK_OUT')">Simulasi Check-out</button></div><div id="scanResult" class="notice">Belum ada transaksi pemindaian.</div><button class="btn secondary small" onclick="scanDone=false;$('#scanstatus').value='Menunggu pemindaian';$('#scanResult').textContent='Status demo direset.'">Reset demo</button></div></div>`}
function audit(){return head('TRACEABILITY','Log & Audit','Riwayat tindakan pengguna, keputusan, dan aktivitas penggunaan fasilitas.')+`<div class="card"><h3 class="sectiontitle">Aktivitas terbaru</h3><div class="activity">${eventLog.map((e,i)=>`<div class="activityrow"><span class="dot"></span><div><strong>${e}</strong><small>14 Nov 2026 · ${i===0?'14:32':i===1?'14:20':'13:58'} WIB · Sistem demo</small></div></div>`).join('')}</div></div>`}
function render(){const map={dashboard,facilities,booking,reservations:reservationsPage,verification,allocation,fairness,qr,audit};const names={dashboard:'Dashboard',facilities:'Fasilitas',booking:'Ajukan Reservasi',reservations:'Reservasi',verification:'Verifikasi',allocation:'Mesin Alokasi',fairness:'Fairness Radar',qr:'QR Check-in/out',audit:'Log & Audit'};$('#crumb').textContent=names[page];$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));content.innerHTML=map[page]();}
function go(p){page=p;render();window.scrollTo(0,0)}$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});$('#role').addEventListener('change',e=>{role=e.target.value;$('#avatar').textContent=role[0];log('Mode aktor diubah menjadi '+role);});
function log(s){eventLog.unshift(s);eventLog=eventLog.slice(0,8)}function prefill(f){go('booking');setTimeout(()=>$('#facility').value=f,0)}
function submitBooking(){let name=$('#reqname').value,group=$('#group').value,facility=$('#facility').value,cert=$('#cert').value,people=Number($('#people').value);let fail=cert==='expired'&&facility.toLowerCase().includes('laboratorium');let cap=facility==='Ruang Diskusi 2'?12:facility==='Ruang Seminar 1'?80:facility==='Studio Multimedia'?20:30;let out=$('#bookingResult');if(fail||people>cap){out.innerHTML=`<div class="notice warn"><strong>Pengajuan belum eligible.</strong><br>${fail?'Sertifikasi wajib belum valid. ':''}${people>cap?'Jumlah peserta melebihi kapasitas fasilitas ('+cap+' orang).':''}<br>Perbaiki data atau pilih fasilitas lain. Pengajuan belum masuk pemeringkatan.</div>`;return;}let id='RSV-'+(270+reservations.length);reservations.push({id,group,facility,date:'18 Nov 2026',time:$('#time').value,activity:$('#activity').value,status:'PENDING_VERIFICATION',score:0,requester:name,U:0,W:0,R:0});log('Pengajuan '+id+' diterima dan menunggu verifikasi');out.innerHTML=`<div class="notice"><strong>Pengajuan berhasil dicatat.</strong><br>ID ${id} · Status PENDING_VERIFICATION. Pengajuan akan diperiksa sebelum masuk mesin alokasi.</div><button class="btn secondary small" onclick="go('reservations')">Lihat daftar reservasi</button>`;}
function verify(id,ok){let r=reservations.find(x=>x.id===id);if(r){r.status=ok?'PENDING':'PENDING_VERIFICATION';log((ok?'Verifikasi disetujui: ':'Perbaikan diminta: ')+id);render();}}
function offerAlt(){let el=$('#altResult');el.innerHTML=`<div class="notice" style="margin-top:12px"><strong>Tawaran alternatif dibuat.</strong><br>Ruang Seminar 1 · 09.00–11.00 · Menunggu persetujuan Kelas B.<br><button class="btn green small" style="margin-top:9px" onclick="acceptAlt()">Kelas B menerima alternatif</button> <button class="btn secondary small" style="margin-top:9px" onclick="$('#altResult').innerHTML='<div class=notice>Alternatif ditolak. Kelas B tetap pada antrean slot awal.</div>'">Tolak alternatif</button></div>`;log('Tawaran alternatif disiapkan untuk Kelas B');}
function acceptAlt(){let b=reservations.find(x=>x.group==='Kelas B');let a=reservations.find(x=>x.group==='Kelas A');if(b){b.facility='Ruang Seminar 1';b.status='APPROVED';}if(a){a.status='APPROVED';}log('Alternatif diterima Kelas B; slot laboratorium diberikan kepada Kelas A');$('#altResult').innerHTML='<div class="notice">Alternatif diterima. Kelas B dipindahkan ke Ruang Seminar 1 dan Kelas A memperoleh slot Laboratorium Kimia. Perubahan dicatat di audit.</div>';}
function openReservation(id){selected=id;go('qr')}
function scan(type){let result=$('#scanResult');let r=reservations.find(x=>x.id===selected);if(!r)return;if(type==='CHECK_IN'){if(r.status!=='APPROVED'&&r.status!=='CHECKED_IN'){result.innerHTML='<span class="pill red">DITOLAK</span><br>Reservasi belum berstatus APPROVED.';$('#scanstatus').value='Reservasi tidak eligible';return;}r.status='CHECKED_IN';$('#scanstatus').value='Token valid · Check-in berhasil';result.innerHTML='<span class="pill green">CHECK-IN BERHASIL</span><br>Identitas, reservasi, masa berlaku, dan nonce diasumsikan valid pada simulasi.';log('Check-in tercatat untuk '+r.id);}else{if(r.status!=='CHECKED_IN'){result.innerHTML='<span class="pill red">DITOLAK</span><br>Check-in belum tercatat.';$('#scanstatus').value='Check-out ditolak';return;}r.status='COMPLETED';$('#scanstatus').value='Check-out berhasil';result.innerHTML='<span class="pill green">CHECK-OUT BERHASIL</span><br>Penggunaan fasilitas selesai dan status menjadi COMPLETED.';log('Check-out selesai untuk '+r.id);} }
render();
</script></body></html>
